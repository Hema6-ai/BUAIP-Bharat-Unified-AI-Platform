version: 1

applications:
  - appRoot: BUAIP
    env:
      variables:
        NODE_ENV: production
        NEXT_PUBLIC_APP_NAME: BUAIP
    backend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies..."
            - cd BUAIP
            - npm ci
        build:
          commands:
            - echo "Building Next.js app..."
            - cd BUAIP
            - npm run build
        postBuild:
          commands:
            - echo "Build complete"
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Frontend pre-build phase"
        build:
          commands:
            - echo "Frontend already built in backend"
      artifacts:
        baseDirectory: BUAIP/.next
        files:
          - "**/*"
      cache:
        paths:
          - BUAIP/node_modules/**/*
          - BUAIP/.next/cache/**/*
    artifacts:
      baseDirectory: BUAIP/.next
      files:
        - "**/*"
    cache:
      paths:
        - "BUAIP/node_modules/**/*"
        - "BUAIP/.next/cache/**/*"
